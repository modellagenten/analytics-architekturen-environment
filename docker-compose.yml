name: qvig-analytics-architekturen-training

# ─── Gemeinsame Airflow-Konfiguration (Profil "airflow") ──────────────────
# Wird von allen Airflow-Services per YAML-Anker geteilt. Airflow orchestriert
# die dbt-Pipeline schichtweise (raw -> staging -> intermediate -> marts) ueber
# Airflow-3-Assets. dbt laeuft in einem eigenen venv im Image (siehe airflow/).
x-qvig-airflow-common: &qvig-airflow-common
  build:
    context: ./airflow
  image: qvig-airflow
  environment: &qvig-airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: qvig-training-not-secret
    # Schulungsmodus: kein Login-Aufwand - jeder Zugriff ist Admin.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Von dbt/den Loadern benoetigte Umgebung (analog zur Werkbank):
    QVIG_DUCKDB: /warehouse/qvig.duckdb
    QVIG_SEED: /seed-data
    DBT_PROFILES_DIR: /dbt_project
    MYSQL_HOST: mysql
    MYSQL_USER: qvig
    MYSQL_PASSWORD: qvig
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./dbt_project:/dbt_project
    - ./warehouse:/warehouse
    - ./scripts:/work
    - ./seed-data:/seed-data
  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ─── Analytische Werkbank: Python + dbt Core (DuckDB) ────────────────
  # Aufruf:  docker compose run --rm workbench <befehl>
  #   docker compose run --rm workbench python /work/load_raw.py
  #   docker compose run --rm workbench dbt build
  workbench:
    build:
      context: ./python
    image: qvig-workbench
    container_name: qvig-workbench
    working_dir: /dbt_project
    environment:
      QVIG_DUCKDB: /warehouse/qvig.duckdb
      QVIG_SEED: /seed-data
      DBT_PROFILES_DIR: /dbt_project
      MYSQL_HOST: mysql
      MYSQL_USER: qvig
      MYSQL_PASSWORD: qvig
    volumes:
      - ./seed-data:/seed-data
      - ./scripts:/work
      - ./dbt_project:/dbt_project
      - ./datengenerator:/datengenerator
      - ./warehouse:/warehouse
    profiles:
      - tools
    restart: "no"

  # ─── Operatives Quellsystem / Serving-DB: MySQL 8 ────────────────────
  # qvig_op   = operatives Quellsystem (Uebung 3, Zeilenspeicher)
  # qvig_mart = Serving-Schicht fuer Metabase (Uebung 5)
  mysql:
    image: mysql:8.4
    container_name: qvig-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qvig_op
      MYSQL_USER: qvig
      MYSQL_PASSWORD: qvig
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uqvig", "-pqvig"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─── Uebung 6: OSS-Mini-Lakehouse ────────────────────────────────────
  # Storage-Layer: MinIO (S3-kompatibel)
  minio:
    image: quay.io/minio/minio:latest
    container_name: qvig-minio-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: qvig
      MINIO_ROOT_PASSWORD: qvigqvig
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data

  # Warehouse-Bucket fuer das Iceberg-Lakehouse anlegen
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: qvig-minio-storage-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 qvig qvigqvig
        mc mb -p local/qvig-warehouse
        echo "MinIO Bucket 'qvig-warehouse' bereit."
    restart: "no"

  # Catalog-Layer: Metadaten-Postgres fuer Lakekeeper
  lakekeeper-db:
    image: postgres:17
    container_name: qvig-lakekeeper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - lakekeeper_db_data:/var/lib/postgresql/data

  # Catalog-Layer: Lakekeeper-Schema migrieren (einmalig)
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: qvig-lakekeeper-migrate
    restart: "no"
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: qvig-training-not-secret
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      RUST_LOG: info
    depends_on:
      lakekeeper-db:
        condition: service_healthy

  # Catalog-Layer: Lakekeeper (Iceberg REST Catalog)
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: qvig-lakekeeper
    restart: unless-stopped
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: qvig-training-not-secret
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
      RUST_LOG: info
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy

  # Catalog-Layer: Lakekeeper einmalig bootstrappen (Terms akzeptieren,
  # Default-Projekt anlegen). Das Warehouse legen die Teilnehmenden in
  # Phase 1 der Uebung selbst per REST-API an.
  lakekeeper-bootstrap:
    image: curlimages/curl:latest
    container_name: qvig-lakekeeper-bootstrap
    restart: "no"
    command:
      - -sS
      - -X
      - POST
      - http://lakekeeper:8181/management/v1/bootstrap
      - -H
      - "Content-Type: application/json"
      - --data
      - '{"accept-terms-of-use": true}'
    depends_on:
      lakekeeper:
        condition: service_healthy

  # Compute-Layer: Trino mit Iceberg-Connector
  # SQL schreiben die Teilnehmenden in DBeaver (Host localhost, Port 8080).
  trino:
    image: trinodb/trino:476
    container_name: qvig-trino
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino
    healthcheck:
      test: ["CMD", "curl", "-fI", "http://localhost:8080/v1/status"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      lakekeeper:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # BI-Layer: Metabase (Treiber fuer MySQL und Trino im Core enthalten)
  metabase:
    image: metabase/metabase:latest
    container_name: qvig-metabase-bi
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    volumes:
      - metabase_data:/metabase.db

  # ─── Orchestrierung: Apache Airflow 3.3.1 (Profil "airflow") ──────────
  # Start:  docker compose --profile airflow up -d
  # UI:     http://localhost:8081   (kein Login - SimpleAuthManager, all admins)
  #
  # Vier DAGs bilden die dbt-Pipeline ab und haengen ueber Assets zusammen:
  #   qvig_00_raw -> qvig_10_staging -> qvig_20_intermediate -> qvig_30_marts

  # Metadaten-Datenbank fuer Airflow (getrennt von der Lakekeeper-DB)
  airflow-db:
    image: postgres:17
    container_name: qvig-airflow-db
    restart: unless-stopped
    profiles:
      - airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  # Einmalige Initialisierung: Schema migrieren + DuckDB-Schreib-Pool anlegen
  airflow-init:
    <<: *qvig-airflow-common
    container_name: qvig-airflow-init
    profiles:
      - airflow
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config
        /entrypoint airflow db migrate
        /entrypoint airflow pools set duckdb_write 1 "Serialisiert DuckDB-Schreibzugriffe (Single-Writer)"
    environment:
      <<: *qvig-airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  # Web-UI + REST-API (Trino belegt bereits 8080 -> Airflow auf 8081)
  airflow-apiserver:
    <<: *qvig-airflow-common
    container_name: qvig-airflow-apiserver
    profiles:
      - airflow
    command: api-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Scheduler: reagiert auf Asset-Events und plant die DAG-Laeufe
  airflow-scheduler:
    <<: *qvig-airflow-common
    container_name: qvig-airflow-scheduler
    profiles:
      - airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # DAG-Processor: parst die DAG-Dateien (eigener Prozess seit Airflow 3)
  airflow-dag-processor:
    <<: *qvig-airflow-common
    container_name: qvig-airflow-dag-processor
    profiles:
      - airflow
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Triggerer: fuer deferrable Operators / Sensoren
  airflow-triggerer:
    <<: *qvig-airflow-common
    container_name: qvig-airflow-triggerer
    profiles:
      - airflow
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  lakekeeper_db_data:
  metabase_data:
  mysql_data:
  airflow_db_data:
