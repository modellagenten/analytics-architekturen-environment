name: 'qvig'
version: '1.0.0'
config-version: 2

profile: 'qvig'

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Schichten der QVIG-Architektur:
#   staging      -> Views: 1:1 gereinigte Rohdaten (Casts, Normalisierung)
#   intermediate -> Views: fachliche Anreicherung / Joins
#   marts        -> Tabellen: Star-Schema + Reporting-Marts (Column Store)
#   data_vault   -> Tabellen: Raw Vault (Uebung 2b, Insert-Only)
#   +tags erlauben die schichtweise Selektion in Airflow (--select tag:staging).
models:
  qvig:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
    data_vault:
      +materialized: table
      +schema: raw_vault
      +tags: ["data_vault"]
